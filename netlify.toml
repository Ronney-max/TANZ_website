[build]
  base = "tanz-hospitality"
  command = "npm run build"
  publish = "dist-netlify"
[build.environment]
  NODE_VERSION = "22.19.0"
[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[dev]
  command = "npm run dev"
  targetPort = 5173
  framework = "#custom"
  autoLaunch = true
